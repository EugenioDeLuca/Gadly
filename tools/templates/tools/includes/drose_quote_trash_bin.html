{% load i18n %}
<div id="drose-quote-trash-bin" class="drose-quote-trash-bin">
    <a href="{% url 'drose_quote_staff_trash' %}" class="drose-quote-trash-bin__btn" id="drose-quote-trash-bin-btn" aria-label="{% trans 'Trash — open removed quotes' %}" title="{% trans 'Open removed quotes' %}">
        {% if drose_deleted_quote_count %}
        <span class="drose-quote-trash-bin__count{% if drose_deleted_quote_count >= 10 %} drose-quote-trash-bin__count--wide{% endif %}" id="drose-quote-trash-bin-count">{{ drose_deleted_quote_count }}</span>
        {% else %}
        <span class="drose-quote-trash-bin__count" id="drose-quote-trash-bin-count" hidden aria-hidden="true"></span>
        {% endif %}
        <svg class="drose-quote-trash-bin__icon" viewBox="0 0 64 72" width="56" height="64" aria-hidden="true" focusable="false">
            <defs>
                <linearGradient id="drose-quote-trash-can-body" x1="32" y1="26" x2="32" y2="66" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#3d73b8"/>
                    <stop offset="100%" stop-color="#003f7f"/>
                </linearGradient>
            </defs>
            <g class="drose-quote-trash-bin__can">
                <path fill="url(#drose-quote-trash-can-body)" stroke="#002a55" stroke-width="1.2" stroke-linejoin="round"
                    d="M14 28h36l-3.2 34.5c-.2 2-1.8 3.5-3.8 3.5H21c-2 0-3.6-1.5-3.8-3.5L14 28z"/>
                <path fill="#5a8fd0" stroke="none"
                    d="M12 28c0-1.1.9-2 2-2h36c1.1 0 2 .9 2 2v2H12v-2z"/>
            </g>
            <g class="drose-quote-trash-bin__lid">
                <path fill="#6a9fd4" stroke="#002a55" stroke-width="1.1" stroke-linejoin="round"
                    d="M22 16h20l2 6H20l2-6z"/>
                <path fill="none" stroke="#002a55" stroke-width="1.4" stroke-linecap="round"
                    d="M26 12v4M38 12v4"/>
            </g>
        </svg>
    </a>
</div>
