{% load i18n %}
<style>
  .drose-email-logo-dark {
    display: none !important;
    max-height: 0 !important;
    overflow: hidden !important;
    mso-hide: all;
  }
  @media (prefers-color-scheme: dark) {
    .drose-email-logo-light {
      display: none !important;
      max-height: 0 !important;
      overflow: hidden !important;
      mso-hide: all;
    }
    .drose-email-logo-dark {
      display: block !important;
      max-height: none !important;
      overflow: visible !important;
    }
  }
</style>
<img class="drose-email-logo-light" src="{{ brand_logo_url }}" width="{{ brand_logo_size }}" height="{{ brand_logo_size }}" alt="{% trans 'Drose logo' %}" style="display:block;border:0;outline:none;text-decoration:none;width:{{ brand_logo_size }}px;height:{{ brand_logo_size }}px;max-width:{{ brand_logo_size }}px;">
<img class="drose-email-logo-dark" src="{{ brand_logo_dark_url }}" width="{{ brand_logo_size }}" height="{{ brand_logo_size }}" alt="{% trans 'Drose logo' %}" style="display:none;border:0;outline:none;text-decoration:none;width:{{ brand_logo_size }}px;height:{{ brand_logo_size }}px;max-width:{{ brand_logo_size }}px;">
