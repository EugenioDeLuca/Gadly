<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imposta nuova password - Gadly (Preview)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at bottom right, #6a0dad, #3554a6 30%, #f4f4f4 70%);
      overflow-x: hidden;
    }
    .site-main {
      flex: 1;
      padding: 24px 16px 40px;
      padding-top: calc(24px + 82px);
      box-sizing: border-box;
    }
    .static-page .static-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 63, 127, 0.2);
      box-sizing: border-box;
    }
    .login-container {
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }
    .static-container h1 {
      font-size: 1.8em;
      color: #003f7f;
      margin: 0 0 8px 0;
      text-align: center;
    }
    .intro {
      margin: 0 0 20px 0;
      color: #555;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .login-form {
      margin: 24px 0;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .login-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 12px;
      box-sizing: border-box;
      transition: border-color 0.2s;
      color: #003f7f;
    }
    .login-input:focus {
      outline: none;
      border-color: #c41e3a;
    }
    .login-input::placeholder {
      color: #999;
    }
    .login-btn {
      width: 100%;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      background: #003f7f;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 0;
      transition: background 0.2s, transform 0.2s;
    }
    .login-btn:hover {
      background: #0056b3;
      transform: scale(1.01);
    }
    .login-hint {
      font-size: 1rem;
      color: #666;
      margin-top: 20px;
      text-align: center;
    }
    .login-hint a {
      font-size: 1rem;
      color: #003f7f;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, opacity 0.2s, color 0.2s;
    }
    .login-hint a:hover {
      color: #0056b3;
      opacity: 0.9;
      transform: scale(1.04);
    }
    @media (max-width: 768px) {
      .static-page .static-container {
        margin: 0 16px;
        padding: 32px 24px;
      }
      .static-container h1 {
        font-size: 1.5em;
      }
    }
    @media (max-width: 600px) {
      .static-page .static-container {
        margin: 0 12px;
        padding: 28px 20px;
      }
      .static-container h1 {
        font-size: 1.35em;
      }
    }
  </style>
</head>
<body class="static-page login-page">
  <main class="site-main">
    <div class="static-container login-container">
      <h1>Imposta nuova password</h1>
      <p class="intro">Inserisci due volte la nuova password per confermarla.</p>

      <form class="login-form">
        <div class="form-group">
          <input
            type="password"
            class="login-input"
            placeholder="Nuova password (minimo 12 caratteri)"
            value=""
          >
        </div>
        <div class="form-group">
          <input
            type="password"
            class="login-input"
            placeholder="Conferma nuova password"
            value=""
          >
        </div>
        <button type="button" class="login-btn">Cambia password</button>
      </form>

      <p class="login-hint">
        <a href="#">Torna al login</a>
      </p>
    </div>
  </main>
</body>
</html>
